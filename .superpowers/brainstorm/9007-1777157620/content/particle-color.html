<h2>粒子色彩方案——深夜模式</h2>
<p class="subtitle">背景 #0A0A0B（深藏青）上，粒子呈现什么色调？</p>

<div class="options">
  <div class="option" data-choice="cyan" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>冰蓝萤火</h3>
      <p>青蓝色调粒子，有淡蓝色光晕。冷调科技感，像深海生物发光。</p>
    </div>
  </div>

  <div class="option" data-choice="gold" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>暖金萤火</h3>
      <p>琥珀/暖金色粒子，像夜晚发热的灯泡或烛火。温暖、有财库的金贵感。</p>
    </div>
  </div>

  <div class="option" data-choice="bicolor" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>双色混合（推荐）</h3>
      <p>主体青蓝色粒子 + 少量暖金粒子点缀，兼具科技感与温暖感。</p>
    </div>
  </div>
</div>
