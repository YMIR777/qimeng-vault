<h2>粒子运动风格——哪种感觉更接近你想要的效果？</h2>
<p class="subtitle">粒子背景的核心运动哲学</p>

<div class="options">
  <div class="option" data-choice="floating" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>悬浮漂浮型（萤火虫）</h3>
      <p>粒子缓慢漂浮，有轻微随机抖动，模拟真实萤火虫/尘埃感。粒子之间距离较大，背景通透。</p>
    </div>
  </div>

  <div class="option" data-choice="fractal" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>分形汇聚型（星云）</h3>
      <p>粒子在空间中形成流动的云团结构，有明显的聚散呼吸感，整体像深海星云或极光流动。</p>
    </div>
  </div>

  <div class="option" data-choice="digital" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>数字矩阵型（赛博）</h3>
      <p>粒子排列相对整齐，有网格感，像数字雨或粒子矩阵，科技感强，视觉密度高。</p>
    </div>
  </div>
</div>
