<h2>鼠标悬浮交互——粒子扰动强度</h2>
<p class="subtitle">鼠标靠近时，粒子产生什么反应？</p>

<div class="options">
  <div class="option" data-choice="subtle" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>轻微涟漪（默认）</h3>
      <p>鼠标附近粒子微微散开，像手指划过水面。柔和、有呼吸感，不抢注意力。</p>
    </div>
  </div>

  <div class="option" data-choice="medium" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>明显推开（推荐）</h3>
      <p>鼠标附近粒子明显被推开形成一个圆形的"空洞"，粒子像被拨开的水流，有物理感和互动感。</p>
    </div>
  </div>

  <div class="option" data-choice="dramatic" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>强烈漩涡</h3>
      <p>粒子围绕鼠标形成旋转漩涡效果，视觉冲击力强，但可能干扰主内容。</p>
    </div>
  </div>
</div>
